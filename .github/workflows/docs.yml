name: Docs
on:
  push:
    paths: ['docs/**', 'specs/**', 'tools/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'specs/**', 'tools/**', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/generar_docs.py --verificar
      - run: python tools/progreso.py --verificar
      - run: python tools/backlog.py --verificar