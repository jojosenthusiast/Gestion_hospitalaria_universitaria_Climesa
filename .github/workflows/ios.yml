name: iOS
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
# Builds the monorepo ios/ project (CLIMESA.xcodeproj, shared scheme CLIMESA), tests the ClimesaCore package and
# boots the app on an iOS simulator (CLIMESAUITests) to assert that the login screen appears.
# No secrets: the project reads Configuration.plist and CLIMESA_API_BASE_URL; Config.xcconfig is not used by the build.
# No job reads secrets. B-02: the Release IPA never carries demo credentials (the ipa job checks its Info.plist).
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Every Swift source is in the Xcode project
        # ios/AGENTS.md: each new .swift file under CLIMESA/ or Core/ must also be added to project.pbxproj.
        run: |
          missing=0
          for file in $(find CLIMESA Core -name '*.swift' | sort); do
            grep -q "path = \"$file\"" CLIMESA.xcodeproj/project.pbxproj || { echo "::error file=ios/$file::not in CLIMESA.xcodeproj/project.pbxproj"; missing=1; }
          done
          exit $missing
      - name: Core tests (Swift package)
        run: swift test
      - name: App build (simulator, unsigned)
        run: xcodebuild -project CLIMESA.xcodeproj -scheme CLIMESA -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      # Ad-hoc signing (no team, no secrets): an unsigned simulator build has no keychain entitlement and the app would show the session-recovery error instead of login.
      - name: UI test (boots the app on an iOS simulator, asserts the login screen)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone [0-9]+ \(' | sed -E 's/^ +(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "Simulator: $DEVICE"
          test -n "$DEVICE"
          xcodebuild test -project CLIMESA.xcodeproj -scheme CLIMESA -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,name=$DEVICE" -resultBundlePath "$RUNNER_TEMP/ui.xcresult" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES
      - name: Upload UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/ui.xcresult
  ipa:
    # IPA sin firmar para sideloading: lo firma quien lo instala (Sideloadly + Apple ID gratuita). Ver ios/README.md, sección IPA.
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned app build (device, Release)
        working-directory: ios
        run: xcodebuild -project CLIMESA.xcodeproj -scheme CLIMESA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Release carries no demo login (B-02)
        working-directory: ios
        run: |
          plist=build/Build/Products/Release-iphoneos/CLIMESA.app/Info.plist
          login=$(/usr/libexec/PlistBuddy -c 'Print :ClimesaDemoLogin' "$plist" 2>/dev/null || true)
          credentials=$(/usr/libexec/PlistBuddy -c 'Print :ClimesaDemoCredentials' "$plist" 2>/dev/null || true)
          if [ "$login" = "YES" ] || [ -n "$credentials" ]; then echo "::error::The Release IPA must not carry the demo login"; exit 1; fi
          echo "Release sin login de prueba."
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CLIMESA.app Payload/
          zip -qry CLIMESA-sin-firmar.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CLIMESA-ios-ipa
          path: ios/CLIMESA-sin-firmar.ipa
          retention-days: 14
          if-no-files-found: error
