name: Web
on:
  push:
    paths: ['web/**', 'contrato/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'contrato/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - name: Generated types are up to date
        run: git diff --exit-code src/lib/generated/openapi.d.ts
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_public_ci_placeholder
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
      - run: npm test
