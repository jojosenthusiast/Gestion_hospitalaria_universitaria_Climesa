name: Core S1 S2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix web
      - run: npm test --prefix backend -- --ci
      - run: npm run build --prefix backend
      - run: npm run api:generate --prefix backend
      - run: npm run api:generate --prefix web
      - run: git diff --exit-code backend/openapi.json web/src/lib/generated/openapi.d.ts
      - run: npm run build --prefix web
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_public_ci_placeholder
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
      - run: python tools/generar_docs.py --verificar
      - run: python tools/progreso.py --verificar
      - run: python tools/backlog.py --verificar
  postgres-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml up --wait db
      - run: docker compose -f compose.test.yaml exec -T db bash -c 'psql -U postgres -d sghu_test -v ON_ERROR_STOP=1 -f /checks/pruebas/01_invariantes.sql'
      - run: docker compose -f compose.test.yaml exec -T -e PSQL="psql -U postgres -d sghu_test" db bash /checks/pruebas/02_concurrencia.sh
      - if: always()
        run: docker compose -f compose.test.yaml down -v
