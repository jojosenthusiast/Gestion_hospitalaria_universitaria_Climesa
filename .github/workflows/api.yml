name: API
on:
  push:
    paths: ['api/**', 'contrato/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'contrato/**', '.github/workflows/api.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run build
      - run: npm run api:generate
      - name: Contract is up to date
        run: git diff --exit-code ../contrato/openapi.json