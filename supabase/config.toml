project_id = "sghu-climesa"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/aceptar-invitacion", "http://localhost:5173/confirmar-correo", "http://localhost:5173/restablecer"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# BL-07: plantillas en español con marca (supabase/templates/README.md). En producción se pegan en el panel.
[auth.email.template.confirmation]
subject = "Confirma tu correo en CLIMESA"
content_path = "./supabase/templates/confirmacion.html"
[auth.email.template.invite]
subject = "Tu invitación a CLIMESA"
content_path = "./supabase/templates/invitacion.html"
[auth.email.template.recovery]
subject = "Restablece tu contraseña de CLIMESA"
content_path = "./supabase/templates/recuperacion.html"
[auth.email.template.magic_link]
subject = "Tu enlace de acceso a CLIMESA"
content_path = "./supabase/templates/enlace-magico.html"
[auth.email.template.email_change]
subject = "Confirma tu nuevo correo en CLIMESA"
content_path = "./supabase/templates/cambio-correo.html"
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/acceso/hook_token"
