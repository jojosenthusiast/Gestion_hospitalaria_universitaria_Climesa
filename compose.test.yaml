# Entorno desechable, exclusivamente local. No apunta a Supabase.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sghu_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prueba-local-desechable
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase:/checks:ro
      - ./deployment/init-test-db.sh:/docker-entrypoint-initdb.d/01-climesa.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d sghu_test"]
      interval: 2s
      timeout: 5s
      retries: 30
