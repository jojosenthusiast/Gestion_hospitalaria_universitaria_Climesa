# Entorno desechable, exclusivamente local. No apunta a Supabase.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sghu_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prueba-local-desechable
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase:/checks:ro
      - ./deployment/init-test-db.sh:/docker-entrypoint-initdb.d/01-climesa.sh:ro
    healthcheck:
      # The init script runs against a temporary socket-only server, so a plain pg_isready can
      # report ready before migrations and seed finish. Require the init sentinel and a TCP check.
      test: [CMD-SHELL, "test -f /tmp/climesa-init-done && pg_isready -h 127.0.0.1 -U postgres -d sghu_test"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
