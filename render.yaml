# Blueprint de Render para SGHU: API (Docker) + web (sitio estático).
# Los nombres de servicio fijan las URL públicas, así que cada servicio puede referenciar al otro
# sin esperar al primer despliegue. Si Render avisa que un nombre ya está tomado y le añade un
# sufijo, actualiza juntos WEB_APP_URL y VITE_API_BASE_URL.
# Los secretos nunca se guardan aquí: cada variable con `sync: false` se escribe a mano en el panel.
services:
  - type: web
    name: sghu-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: virginia
    healthCheckPath: /salud
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: WEB_APP_URL
        value: https://sghu-web.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: sghu-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sghu-api.onrender.com/api/v1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
